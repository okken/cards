name: Publish to PyPI

# Runs on every push, but only publishes for tags (e.g. 3.0.0).
# Uses PyPI trusted publishing: no token is stored. PyPI's trusted publisher for this project must name
# this repository, this workflow file (publish-to-pypi.yml) and the "pypi" environment.
on: push

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets the job prove to PyPI that it's this workflow
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install pypa/build
      run: python -m pip install build
    - name: Build a binary wheel and a source tarball
      run: python -m build --sdist --wheel --outdir dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
