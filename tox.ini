[tox]
envlist = py310, py311, py312, py313, py314, py314t, py315, py315t, coverage
skip_missing_interpreters = True

[testenv]
deps =
  pytest
commands =
  pytest {posargs}
package = wheel
wheel_build_env = .pkg

[testenv:coverage]
basepython = python3.14
deps =
  {[testenv]deps}
  pytest-cov
commands =
  pytest --cov {posargs}

[pytest]
addopts =
    --strict-markers
    --strict-config
    -ra
    --color=yes 
testpaths = tests
pythonpath = tests/cli
